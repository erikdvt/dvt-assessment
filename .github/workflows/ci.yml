name: iOS CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint

      - name: Build and test
        run: |
          xcodebuild test \
            -project WeatherApp/WeawtherApp.xcodeproj \
            -scheme WeawtherApp \
            -destination 'platform=iOS Simulator,name=iPhone 16'
